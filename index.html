<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hana Der - Cyber Bio</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #020205;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

        /* --- BẢNG THÔNG BÁO CHÀO MỪNG --- */
        .welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 2, 5, 0.92);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .welcome-box {
            background: rgba(12, 12, 20, 0.95);
            border: 1px solid rgba(0, 243, 255, 0.5);
            border-radius: 30px;
            padding: 38px 32px;
            width: 90%;
            max-width: 390px;
            text-align: center;
            box-shadow: 0 0 60px rgba(0, 243, 255, 0.3), inset 0 0 20px rgba(0, 243, 255, 0.1);
            animation: popUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes popUp {
            from { opacity: 0; transform: scale(0.8) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .welcome-box h2 {
            font-size: 21px;
            font-weight: 800;
            margin-bottom: 12px;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.7);
        }

        .welcome-box p {
            font-size: 14px;
            color: #a0aec0;
            margin-bottom: 26px;
            line-height: 1.6;
        }

        .enter-btn {
            background: linear-gradient(135deg, #00f3ff, #ff007f);
            color: #ffffff;
            border: none;
            padding: 15px 28px;
            border-radius: 18px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.45);
            width: 100%;
        }

        .enter-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 40px rgba(255, 0, 127, 0.8);
        }

        /* --- HIỆU NỨNG ĐÈN NỀN --- */
        .neon-bg-1, .neon-bg-2 {
            position: fixed;
            border-radius: 50%;
            filter: blur(150px);
            z-index: -2;
            pointer-events: none;
        }
        .neon-bg-1 {
            width: 400px;
            height: 400px;
            background: rgba(0, 243, 255, 0.15);
            top: 5%;
            left: 10%;
        }
        .neon-bg-2 {
            width: 450px;
            height: 450px;
            background: rgba(255, 0, 128, 0.15);
            bottom: 5%;
            right: 10%;
        }

        /* --- KHUNG BIO CHÍNH --- */
        .container {
            width: 100%;
            max-width: 440px;
            background: rgba(10, 10, 18, 0.65);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(0, 243, 255, 0.25);
            border-radius: 38px;
            padding: 42px 26px;
            box-shadow: 0 35px 70px rgba(0, 0, 0, 0.95), 0 0 35px rgba(0, 243, 255, 0.1);
            text-align: center;
            position: relative;
            z-index: 2;
            animation: floatCard 6s ease-in-out infinite alternate;
        }

        @keyframes floatCard {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-8px); }
        }

        /* --- AVATAR VIDEO & ANIME LOLI --- */
        .avatar-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 24px;
        }

        .avatar-container::before {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            background: linear-gradient(60deg, #00f3ff, #ff007f, #7000ff, #00f3ff);
            z-index: -1;
            background-size: 300% 300%;
            animation: rgbBorder 4s linear infinite;
            filter: drop-shadow(0 0 12px rgba(0, 243, 255, 0.7));
        }

        @keyframes rgbBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .avatar-video {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #06060c;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .avatar-container:hover .avatar-video {
            transform: scale(1.08);
        }

        .loli-avatar-decor {
            position: absolute;
            width: 45px;
            height: 45px;
            object-fit: contain;
            z-index: 5;
            pointer-events: none;
            filter: drop-shadow(0 0 6px rgba(0, 243, 255, 0.8));
            animation: bounceLoli 2.5s ease-in-out infinite alternate;
        }
        .loli-decor-1 { top: -15px; left: -10px; transform: rotate(-15deg); }
        .loli-decor-2 { bottom: -10px; right: -10px; transform: rotate(15deg); animation-delay: 1.2s; }

        @keyframes bounceLoli {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-6px) scale(1.1); }
        }

        h1 {
            font-size: 27px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        h1 i {
            font-size: 18px;
            color: #00f3ff;
            filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.9));
        }

        p.bio {
            font-size: 14px;
            color: #a0aec0;
            margin-bottom: 32px;
            font-weight: 500;
            line-height: 1.5;
        }

        /* --- NÚT ÂM THANH GÓC TRÊN --- */
        .music-toggle {
            position: fixed;
            top: 25px;
            right: 25px;
            background: rgba(12, 12, 20, 0.85);
            border: 1px solid rgba(0, 243, 255, 0.5);
            color: #00f3ff;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(15px);
            z-index: 100;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        }

        .music-toggle:hover {
            transform: scale(1.15) rotate(10deg);
            background: rgba(0, 243, 255, 0.2);
            border-color: #00f3ff;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.8);
        }

        .music-toggle.muted i {
            color: #ff007f;
            filter: drop-shadow(0 0 8px rgba(255, 0, 127, 0.8));
        }

        /* --- DANH SÁCH LINK --- */
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 25px;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 17px 22px;
            border-radius: 20px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: visible;
        }

        .link-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.25), transparent);
            transition: 0.6s;
            z-index: 1;
        }

        .link-item:hover::before {
            left: 100%;
        }

        .link-item .left-content {
            display: flex;
            align-items: center;
            gap: 14px;
            position: relative;
            z-index: 2;
        }

        .link-item i.icon {
            font-size: 20px;
            width: 26px;
            text-align: center;
            color: #00f3ff;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 0 6px rgba(0, 243, 255, 0.6));
        }

        .link-item .fa-arrow-right {
            font-size: 12px;
            color: #718096;
            transition: transform 0.3s ease, color 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .btn-loli-img {
            position: absolute;
            top: -18px;
            right: 15px;
            width: 40px;
            height: 40px;
            object-fit: contain;
            z-index: 5;
            pointer-events: none;
            animation: bounceBtnLoli 2s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 5px rgba(255, 0, 127, 0.8));
        }

        @keyframes bounceBtnLoli {
            0% { transform: translateY(0) rotate(-5deg); }
            100% { transform: translateY(-5px) rotate(5deg); }
        }

        .link-item:hover {
            background: rgba(0, 243, 255, 0.09);
            border-color: #00f3ff;
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 35px rgba(0, 243, 255, 0.3);
        }

        .link-item:hover i.icon {
            transform: scale(1.25) rotate(10deg);
            filter: drop-shadow(0 0 12px rgba(0, 243, 255, 0.9));
        }

        .link-item:hover .fa-arrow-right {
            transform: translateX(6px);
            color: #00f3ff;
        }

        /* --- ICON MẠNG XÃ HỘI PHÍA DƯỚI --- */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 20px;
        }

        .social-icon {
            width: 46px;
            height: 46px;
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a0aec0;
            font-size: 18px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-icon:hover {
            background: #ff007f;
            color: #ffffff;
            border-color: #ff007f;
            transform: translateY(-4px) scale(1.1);
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.8);
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #718096;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- BẢNG THÔNG BÁO CHÀO MỪNG -->
    <div class="welcome-overlay" id="welcomeModal">
        <div class="welcome-box">
            <h2>Thông Báo ‼️</h2>
            <p>Trời Trở Lành Vì Đến Mùa Đông 🤡</p>
            <button class="enter-btn" onclick="enterWebsite()">Tắt Thông Báo</button>
        </div>
    </div>

    <!-- Hiệu ứng đèn nền -->
    <div class="neon-bg-1"></div>
    <div class="neon-bg-2"></div>

    <!-- Nút Bật/Tắt Tiếng Video -->
    <div class="music-toggle muted" id="soundBtn" onclick="toggleSound()" title="Bật/Tắt tiếng video">
        <i class="fa-solid fa-volume-xmark" id="soundIcon"></i>
    </div>

    <div class="container">
        <div class="avatar-container">
            <!-- Hình Anime Loli trang trí quanh Avatar -->
            <img src="https://i.imgur.com/7X59s3J.png" class="loli-avatar-decor loli-decor-1" alt="Anime Loli">
            <img src="https://i.imgur.com/8xLqZ3W.png" class="loli-avatar-decor loli-decor-2" alt="Anime Loli">

            <!-- Video Avatar -->
            <video id="avatarVideo" class="avatar-video" loop playsinline muted>
                <source src="https://files.catbox.moe/bnphwb.mp4" type="video/mp4">
            </video>
        </div>

        <h1>Hana Der <i class="fa-solid fa-circle-check"></i></h1>
        <p class="bio">Cập Nhật Mọi Thông Tin Mới Nhất Tại Kênh Telegram</p>

        <div class="links-list">
            <!-- Link Telegram -->
            <a href="https://t.me/InfoMe_Hana" target="_blank" class="link-item">
                <img src="https://i.imgur.com/7X59s3J.png" class="btn-loli-img" alt="Loli Chibi">
                <div class="left-content">
                    <i class="fa-brands fa-telegram icon"></i>
                    <span>Telegram Kênh Thông Báo</span>
                </div>
                <i class="fa-solid fa-arrow-right"></i>
            </a>

            <!-- Nút Tải Mọi File Tại Đây -->
            <a href="https://linkbio.co/hanavn1" target="_blank" class="link-item">
                <img src="https://i.imgur.com/8xLqZ3W.png" class="btn-loli-img" alt="Loli Chibi">
                <div class="left-content">
                    <i class="fa-solid fa-cloud-arrow-down icon"></i>
                    <span>Tải Mọi File Tại Đây</span>
                </div>
                <i class="fa-solid fa-arrow-right"></i>
            </a>
        </div>

        <div class="social-icons">
            <a href="https://t.me/InfoMe_Hana" target="_blank" class="social-icon"><i class="fa-brands fa-telegram"></i></a>
            <a href="https://linkbio.co/hanavn1" target="_blank" class="social-icon"><i class="fa-solid fa-cloud-arrow-down"></i></a>
        </div>

        <div class="footer">
            © 2026 Hana Der. All rights reserved.
        </div>
    </div>

    <script>
        const welcomeModal = document.getElementById('welcomeModal');
        const avatarVideo = document.getElementById('avatarVideo');
        const soundBtn = document.getElementById('soundBtn');
        const soundIcon = document.getElementById('soundIcon');
        let isMuted = true;

        function enterWebsite() {
            // 1. Phát video và bật tiếng ngay lập tức
            avatarVideo.muted = false;
            avatarVideo.play().then(() => {
                isMuted = false;
                soundBtn.classList.remove('muted');
                soundIcon.className = "fa-solid fa-volume-high";
            }).catch(e => {
                console.log("Trình duyệt chặn autoplay có tiếng, chuyển về chế độ mute:", e);
                avatarVideo.muted = true;
                avatarVideo.play();
            });

            // 2. Ẩn và xóa hẳn bảng thông báo chào mừng
            welcomeModal.style.opacity = '0';
            welcomeModal.style.visibility = 'hidden';
            setTimeout(() => {
                welcomeModal.style.display = 'none';
            }, 500);
        }

        function toggleSound() {
            isMuted = !isMuted;
            avatarVideo.muted = isMuted;
            
            if (isMuted) {
                soundBtn.classList.add('muted');
                soundIcon.className = "fa-solid fa-volume-xmark";
            } else {
                soundBtn.classList.remove('muted');
                soundIcon.className = "fa-solid fa-volume-high";
            }
        }
    </script>
</body>
</html>
